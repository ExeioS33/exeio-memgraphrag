[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "memgraphrag"
version = "0.1.0"
description = "Industrialized MemGraphRAG: memory-based GraphRAG API server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "EXEIO", email = "sandria@exeiocorp.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Direct dependencies are pinned (==) to the versions resolved in uv.lock
# (via `uv export` / `uv lock`). Re-run `uv lock` after any pin change.
dependencies = [
    "aiohttp==3.14.3",
    "numpy==2.2.6 ; python_full_version < '3.11'",
    "numpy==2.4.6 ; python_full_version == '3.11.*'",
    "numpy==2.5.1 ; python_full_version >= '3.12'",
    "pandas==2.3.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    "nano-vectordb==0.0.4.3",
    "python-igraph==1.0.0",
    "openai==2.53.0",
    "httpx==0.28.1",
    # filelock was declared here but never imported: no inter-process lock exists.
    # Multi-process safety is handled by refusing WORKERS>1 on file-backed storage
    # (memgraphrag/api/config.py); re-add the pin the day a real lock is written.
    "packaging==25.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
api = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "gunicorn==26.0.0",
    "python-multipart==0.0.32",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "pypdf==6.14.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "pycryptodome==3.23.0",
    "defusedxml==0.7.1",
    "langchain-text-splitters==1.1.2",
    "asyncpg==0.31.0",
    "neo4j==6.2.0",
    "langfuse==3.15.0",
]
pytest = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.1",
]
client = [
    "streamlit==1.60.0",
    "typer==0.27.1",
    "rich==15.0.0",
]
test = [
    "memgraphrag[api,pytest,client]",
]

[project.scripts]
memgraphrag-server = "memgraphrag.api.server:main"
memgraphrag-gunicorn = "memgraphrag.api.gunicorn_runner:main"
memgraphrag-cli = "memgraphrag.client.cli:main"

[tool.setuptools.packages.find]
include = ["memgraphrag*"]

[tool.setuptools.package-data]
memgraphrag = ["py.typed", "prompts/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "offline: tests that need no external services",
    "integration: tests that need Docker Compose backends",
    "requires_db: needs PostgreSQL or Neo4j",
    "requires_api: needs a running API server",
]

# Ruff is configured in ruff.toml, not here: ruff reads ruff.toml first and
# ignores [tool.ruff] entirely, so a section here would silently do nothing.

[tool.uv]
# Prefer the locked set committed as uv.lock for reproducible installs/builds.
package = true
