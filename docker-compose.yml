services:
  memgraphrag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./.env:/app/.env:ro
      # Optional corporate TLS inspection CA (Fortinet, Zscaler, …). Create the
      # file on the host or leave the mount unused when SSL_CERT_FILE is unset.
      - ${MEMGRAPHRAG_HOST_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}:/app/certs/corporate-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      MEMGRAPHRAG_KV_STORAGE: "PGKVStorage"
      MEMGRAPHRAG_VECTOR_STORAGE: "PGVectorStorage"
      MEMGRAPHRAG_GRAPH_STORAGE: "Neo4JStorage"
      MEMGRAPHRAG_DOC_STATUS_STORAGE: "PGDocStatusStorage"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rag}"
      POSTGRES_DATABASE: "${POSTGRES_DATABASE:-rag}"
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-memgraphrag}"
      PPR_ENGINE: "${PPR_ENGINE:-igraph}"
      DOCLING_ENDPOINT: "${DOCLING_ENDPOINT:-}"
      MEMGRAPHRAG_PARSER: "${MEMGRAPHRAG_PARSER:-pdf:docling-P;*:legacy-F}"
      # Entrypoint merges /app/certs/corporate-ca.crt into SSL_CERT_FILE.
      MEMGRAPHRAG_CORP_CA_FILE: "/app/certs/corporate-ca.crt"
      SSL_CERT_FILE: "/app/certs/corporate-ca.crt"
      REQUESTS_CA_BUNDLE: "/app/certs/corporate-ca.crt"
      CURL_CA_BUNDLE: "/app/certs/corporate-ca.crt"
      SSL_VERIFY: "${SSL_VERIFY:-true}"
      CHUNK_SIZE: "${CHUNK_SIZE:-400}"
      CHUNK_OVERLAP_SIZE: "${CHUNK_OVERLAP_SIZE:-40}"
      EMBEDDING_MAX_TOKENS: "${EMBEDDING_MAX_TOKENS:-480}"
      EMBEDDING_SEND_DIMENSIONS: "${EMBEDDING_SEND_DIMENSIONS:-false}"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rag}"
      POSTGRES_DB: "${POSTGRES_DATABASE:-rag}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DATABASE:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-memgraphrag}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
    volumes:
      - neo4j_data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Optional Docling parser service:
  #   docker compose --profile docling up -d
  docling:
    profiles: ["docling"]
    image: ghcr.io/docling-project/docling-serve:latest
    ports:
      - "${DOCLING_PUBLISH_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
