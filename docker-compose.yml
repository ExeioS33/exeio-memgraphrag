services:
  memgraphrag:
    image: exeio-memgraphrag:${MEMGRAPHRAG_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MEMGRAPHRAG_VERSION: ${MEMGRAPHRAG_VERSION:-0.1.0}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
      tags:
        - exeio-memgraphrag:${MEMGRAPHRAG_VERSION:-0.1.0}
        - exeio-memgraphrag:latest
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./.env:/app/.env:ro
      # Documents the web UI browses. Read-only: the library serves and previews
      # what is already there, it never writes. Point LIBRARY_HOST_DIR at your
      # corpus; the default keeps the stack starting on a fresh clone.
      - ${LIBRARY_HOST_DIR:-./data/library}:/app/data/library:ro
      # Optional corporate TLS inspection CA (Fortinet, Zscaler, …). Create the
      # file on the host or leave the mount unused when SSL_CERT_FILE is unset.
      - ${MEMGRAPHRAG_HOST_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}:/app/certs/corporate-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Everything the app reads comes from .env, so adding a knob no longer means
    # editing this file. `environment:` below still wins, and only carries values
    # that must differ inside the container.
    env_file:
      - .env
    environment:
      # --- Bind address and container paths -------------------------------
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      # Read-only document library. LIBRARY_HOST_DIR on the host is mounted here;
      # without the override the app would look for the host path from .env, which
      # does not exist inside the container.
      LIBRARY_ROOT: "/app/data/library"

      # --- Storage backends ------------------------------------------------
      # Shared-database backends: this is what makes the compose stack safe to
      # restart against an existing volume. Switching any of them back to a
      # file-backed default (Json*/Nano*/Igraph*) also caps the process at
      # WORKERS=1 — startup refuses more (see memgraphrag/api/config.py).
      MEMGRAPHRAG_KV_STORAGE: "PGKVStorage"
      MEMGRAPHRAG_VECTOR_STORAGE: "PGVectorStorage"
      MEMGRAPHRAG_GRAPH_STORAGE: "Neo4JStorage"
      MEMGRAPHRAG_DOC_STATUS_STORAGE: "PGDocStatusStorage"

      # --- Service addresses on the compose network -------------------------
      # These MUST override .env: a host file names the developer's own machine
      # (192.168.x.x, localhost), which is not what a container should dial.
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      NEO4J_URI: "neo4j://neo4j:7687"
      # Chat persistence. Points at the dedicated `postgres-app` service over the
      # compose network, so the host publish port (5433) is irrelevant here. The
      # `:?` guard is what fails the stack early with a readable message.
      APP_DATABASE_URL: "postgresql://${APP_POSTGRES_USER:-app}:${APP_POSTGRES_PASSWORD:?set APP_POSTGRES_PASSWORD in .env}@postgres-app:5432/${APP_POSTGRES_DATABASE:-memgraphrag_app}"

      # --- Corporate TLS interception --------------------------------------
      # Entrypoint merges /app/certs/corporate-ca.crt into SSL_CERT_FILE. All four
      # names are overridden because .env sets host-relative paths for them.
      MEMGRAPHRAG_CORP_CA_FILE: "/app/certs/corporate-ca.crt"
      MEMGRAPHRAG_SSL_CERT_FILE: "/app/certs/corporate-ca.crt"
      SSL_CERT_FILE: "/app/certs/corporate-ca.crt"
      REQUESTS_CA_BUNDLE: "/app/certs/corporate-ca.crt"
      CURL_CA_BUNDLE: "/app/certs/corporate-ca.crt"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DATABASE:-rag}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: the app reaches Postgres over the compose network. Override
      # POSTGRES_PUBLISH_ADDR to expose it deliberately.
      - "${POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DATABASE:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Application data only — chat threads and messages. Deliberately a SECOND
  # instance rather than another schema in `postgres` above: product data and
  # knowledge data have different lifecycles and different blast radii, and wiping
  # the RAG corpus must never take the conversations with it.
  postgres-app:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${APP_POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${APP_POSTGRES_PASSWORD:?set APP_POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${APP_POSTGRES_DATABASE:-memgraphrag_app}"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    ports:
      # 5433 on the host: 5432 is normally already taken by the RAG database.
      - "${APP_POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${APP_POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${APP_POSTGRES_USER:-app} -d ${APP_POSTGRES_DATABASE:-memgraphrag_app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
    volumes:
      - neo4j_data:/data
    ports:
      # Loopback-only, as for Postgres: gds.* runs unrestricted on this instance.
      - "${NEO4J_PUBLISH_ADDR:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_PUBLISH_ADDR:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Optional Docling parser service:
  #   docker compose --profile docling up -d
  docling:
    profiles: ["docling"]
    image: ghcr.io/docling-project/docling-serve:latest
    ports:
      - "${DOCLING_PUBLISH_ADDR:-127.0.0.1}:${DOCLING_PUBLISH_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_app_data:
  neo4j_data:
