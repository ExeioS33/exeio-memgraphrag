services:
  memgraphrag:
    image: exeio-memgraphrag:${MEMGRAPHRAG_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MEMGRAPHRAG_VERSION: ${MEMGRAPHRAG_VERSION:-0.1.0}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
      tags:
        - exeio-memgraphrag:${MEMGRAPHRAG_VERSION:-0.1.0}
        - exeio-memgraphrag:latest
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./.env:/app/.env:ro
      # Optional corporate TLS inspection CA (Fortinet, Zscaler, …). Create the
      # file on the host or leave the mount unused when SSL_CERT_FILE is unset.
      - ${MEMGRAPHRAG_HOST_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}:/app/certs/corporate-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      # Shared-database backends: this is what makes the compose stack safe to
      # restart against an existing volume. Switching any of them back to a
      # file-backed default (Json*/Nano*/Igraph*) also caps the process at
      # WORKERS=1 — startup refuses more (see memgraphrag/api/config.py).
      MEMGRAPHRAG_KV_STORAGE: "PGKVStorage"
      MEMGRAPHRAG_VECTOR_STORAGE: "PGVectorStorage"
      MEMGRAPHRAG_GRAPH_STORAGE: "Neo4JStorage"
      MEMGRAPHRAG_DOC_STATUS_STORAGE: "PGDocStatusStorage"
      # The ingest pipeline lock is per-process, so extra workers would break the
      # "409 while busy" guarantee even on Postgres/Neo4j.
      WORKERS: "${WORKERS:-1}"
      # --- Authentication -------------------------------------------------
      # These were previously not passed through at all, so a compose deployment
      # published :9621 with no credential regardless of what the host .env set.
      MEMGRAPHRAG_API_KEY: "${MEMGRAPHRAG_API_KEY:-}"
      AUTH_ACCOUNTS: "${AUTH_ACCOUNTS:-}"
      TOKEN_SECRET: "${TOKEN_SECRET:-}"
      REQUIRE_AUTH: "${REQUIRE_AUTH:-false}"
      # "*" is the safe default only because it now disables credentialed CORS.
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      # Do not add /api/* here: it fronts the billed LLM (see api/config.py).
      WHITELIST_PATHS: "${WHITELIST_PATHS:-/health,/docs,/openapi.json}"
      # Chat persistence. Points at the dedicated `postgres-app` service over the
      # compose network, so the host publish port (5433) is irrelevant here.
      APP_DATABASE_URL: "postgresql://${APP_POSTGRES_USER:-app}:${APP_POSTGRES_PASSWORD:?set APP_POSTGRES_PASSWORD in .env}@postgres-app:5432/${APP_POSTGRES_DATABASE:-memgraphrag_app}"
      # Allow-list for the web UI's model picker; empty means LLM_MODEL only.
      LLM_MODELS: "${LLM_MODELS:-}"
      # MCP lives in this container, on the port already published — a separate
      # service would double the in-memory graph to serve the same bytes.
      MCP_ENABLED: "${MCP_ENABLED:-false}"
      # Must list the public hostname, with and without the port, or a remote MCP
      # client is refused with 421 Invalid Host header and no usable diagnostic.
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_ISSUER_URL: "${MCP_ISSUER_URL:-}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DATABASE: "${POSTGRES_DATABASE:-rag}"
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      PPR_ENGINE: "${PPR_ENGINE:-igraph}"
      DOCLING_ENDPOINT: "${DOCLING_ENDPOINT:-}"
      MEMGRAPHRAG_PARSER: "${MEMGRAPHRAG_PARSER:-pdf:docling-P;*:legacy-F}"
      # Entrypoint merges /app/certs/corporate-ca.crt into SSL_CERT_FILE.
      MEMGRAPHRAG_CORP_CA_FILE: "/app/certs/corporate-ca.crt"
      SSL_CERT_FILE: "/app/certs/corporate-ca.crt"
      REQUESTS_CA_BUNDLE: "/app/certs/corporate-ca.crt"
      CURL_CA_BUNDLE: "/app/certs/corporate-ca.crt"
      SSL_VERIFY: "${SSL_VERIFY:-true}"
      CHUNK_SIZE: "${CHUNK_SIZE:-400}"
      CHUNK_OVERLAP_SIZE: "${CHUNK_OVERLAP_SIZE:-40}"
      EMBEDDING_MAX_TOKENS: "${EMBEDDING_MAX_TOKENS:-480}"
      EMBEDDING_SEND_DIMENSIONS: "${EMBEDDING_SEND_DIMENSIONS:-false}"
      # LLM / embedding bindings from host .env. These are the only names the
      # app reads; a self-hosted vLLM/Ollama is reached through LLM_BINDING_HOST.
      LLM_BINDING: "${LLM_BINDING:-openai}"
      LLM_BINDING_HOST: "${LLM_BINDING_HOST:-}"
      LLM_BINDING_API_KEY: "${LLM_BINDING_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # LLM_TIMEOUT was injected here but read nowhere: the HTTP timeout is
      # hard-coded in llm/openai_compatible.py as httpx.Timeout(150.0, connect=30.0).
      MAX_ASYNC_LLM: "${MAX_ASYNC_LLM:-4}"
      EMBEDDING_BINDING: "${EMBEDDING_BINDING:-openai}"
      EMBEDDING_BINDING_HOST: "${EMBEDDING_BINDING_HOST:-}"
      EMBEDDING_BINDING_API_KEY: "${EMBEDDING_BINDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-}"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DATABASE:-rag}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: the app reaches Postgres over the compose network. Override
      # POSTGRES_PUBLISH_ADDR to expose it deliberately.
      - "${POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DATABASE:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Application data only — chat threads and messages. Deliberately a SECOND
  # instance rather than another schema in `postgres` above: product data and
  # knowledge data have different lifecycles and different blast radii, and wiping
  # the RAG corpus must never take the conversations with it.
  postgres-app:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${APP_POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${APP_POSTGRES_PASSWORD:?set APP_POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${APP_POSTGRES_DATABASE:-memgraphrag_app}"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    ports:
      # 5433 on the host: 5432 is normally already taken by the RAG database.
      - "${APP_POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${APP_POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${APP_POSTGRES_USER:-app} -d ${APP_POSTGRES_DATABASE:-memgraphrag_app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
    volumes:
      - neo4j_data:/data
    ports:
      # Loopback-only, as for Postgres: gds.* runs unrestricted on this instance.
      - "${NEO4J_PUBLISH_ADDR:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_PUBLISH_ADDR:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Optional Docling parser service:
  #   docker compose --profile docling up -d
  docling:
    profiles: ["docling"]
    image: ghcr.io/docling-project/docling-serve:latest
    ports:
      - "${DOCLING_PUBLISH_ADDR:-127.0.0.1}:${DOCLING_PUBLISH_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_app_data:
  neo4j_data:
